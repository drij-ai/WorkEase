<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Holiday | WorkEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fb;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .delete-card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid #e7ebf2;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            max-width: 480px;
            width: 100%;
            padding: 32px 28px;
            text-align: center;
        }

        .warning-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #fee2e2;
            color: #dc2626;
            font-size: 28px;
            display: grid;
            place-items: center;
            margin: 0 auto 20px;
        }
    </style>
</head>
<body>

<div class="delete-card">
    <div class="warning-icon">
        <i class="bi bi-exclamation-triangle-fill"></i>
    </div>

    <h4 class="fw-bold text-dark mb-2">Delete Holiday?</h4>
    <p class="text-muted mb-4">
        Are you sure you want to remove <strong>"{{ holiday.title }}"</strong> ({{ holiday.date|date:"d M Y" }}) from the company calendar? This cannot be undone.
    </p>

    <form method="POST">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'holiday_list' %}" class="btn btn-light border px-4 py-2 rounded-3">Cancel</a>
            <button type="submit" class="btn btn-danger px-4 py-2 rounded-3 fw-semibold">
                <i class="bi bi-trash3 me-1"></i> Confirm Delete
            </button>
        </div>
    </form>
</div>

</body>
</html>
