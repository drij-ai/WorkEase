
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User - WorkEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Add Login User</h4>
        </div>

        <div class="card-body">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'user_add' %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Select Employee</label>
                    <select name="employee" class="form-select" required>
                        <option value="">-- Select Employee --</option>
                        {% for employee in employees %}
                            <option value="{{ employee.id }}">
                                {{ employee.employee_id }} - {{ employee.name }}
                            </option>
                        {% endfor %}
                    </select>

                    {% if not employees %}
                        <small class="text-danger">
                            No employees available without a login account.
                        </small>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password"
                           class="form-control" minlength="8" required>
                    <small class="text-muted">At least 8 characters.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password"
                           class="form-control" minlength="8" required>
                </div>

                <button type="submit" class="btn btn-primary"
                        {% if not employees %}disabled{% endif %}>
                    Create User
                </button>

                <a href="{% url 'user_management' %}"
                   class="btn btn-secondary">Back</a>
            </form>

        </div>
    </div>
</div>

</body>
</html>
