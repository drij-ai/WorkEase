
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User - WorkEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .alert-warning {
            background-color: #fee2e2;
            border-color: #fecaca;
            color: #dc2626;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Add Login User</h4>
        </div>

        <div class="card-body">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' or message.tags == 'warning' %}danger{% elif message.tags == 'success' %}success{% else %}info{% endif %} alert-dismissible fade show" role="alert">
                        <i class="bi bi-{% if message.tags == 'error' or message.tags == 'warning' %}exclamation-triangle-fill text-danger{% elif message.tags == 'success' %}check-circle-fill text-success{% else %}info-circle text-info{% endif %} me-2"></i>
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'user_add' %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Select Employee <span class="text-danger">*</span></label>
                    <select name="employee" class="form-select" required>
                        <option value="">-- Select Employee --</option>
                        {% for employee in employees %}
                            <option value="{{ employee.id }}" {% if selected_employee == employee.id|stringformat:"s" %}selected{% endif %}>
                                {{ employee.employee_id }} - {{ employee.name }}
                            </option>
                        {% endfor %}
                    </select>

                    {% if not employees %}
                        <small class="text-danger d-block mt-1 fw-semibold">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>No employees available without a login account.
                        </small>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label class="form-label">Username <span class="text-danger">*</span></label>
                    <input type="text" name="username"
                           class="form-control" value="{{ username|default:'' }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password <span class="text-danger">*</span></label>
                    <input type="password" name="password"
                           class="form-control" minlength="8" required>
                    <small class="text-danger d-block mt-1"><i class="bi bi-exclamation-circle-fill me-1"></i>At least 8 characters.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password <span class="text-danger">*</span></label>
                    <input type="password" name="confirm_password"
                           class="form-control" minlength="8" required>
                </div>

                <button type="submit" class="btn btn-primary"
                        {% if not employees %}disabled{% endif %}>
                    Create User
                </button>

                <a href="{% url 'user_management' %}"
                   class="btn btn-secondary">Back</a>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
