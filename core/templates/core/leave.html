<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply Leave - WorkEase</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="/dashboard/">
                WorkEase
            </a>

            <span class="text-white">
                {{ employee.name }}
            </span>

        </div>
    </nav>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4">

                        <h3 class="mb-2">
                            📝 Apply for Leave
                        </h3>

                        <p class="text-muted mb-4">
                            Fill in the details below to submit your leave request.
                        </p>

                        {% if error %}
                            <div class="alert alert-danger" role="alert">
                                {{ error }}
                            </div>
                        {% endif %}

                        <form method="POST">

                            {% csrf_token %}

                            <!-- Leave Type -->
                            <div class="mb-3">

                                <label for="leave_type" class="form-label">
                                    Leave Type
                                </label>

                                <select
                                    id="leave_type"
                                    name="leave_type"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Select Leave Type
                                    </option>

                                    <option value="Casual">
                                        Casual
                                    </option>

                                    <option value="Sick">
                                        Sick
                                    </option>

                                    <option value="Paid">
                                        Paid
                                    </option>

                                    <option value="Unpaid">
                                        Unpaid
                                    </option>

                                </select>

                            </div>

                            <!-- From Date -->
                            <div class="mb-3">

                                <label for="from_date" class="form-label">
                                    From Date
                                </label>

                                <input
                                    type="date"
                                    id="from_date"
                                    name="from_date"
                                    class="form-control"
                                    min="{{ today }}"
                                    required
                                >

                            </div>

                            <!-- To Date -->
                            <div class="mb-3">

                                <label for="to_date" class="form-label">
                                    To Date
                                </label>

                                <input
                                    type="date"
                                    id="to_date"
                                    name="to_date"
                                    class="form-control"
                                    min="{{ today }}"
                                    required
                                >

                            </div>

                            <!-- Reason -->
                            <div class="mb-3">

                                <label for="reason" class="form-label">
                                    Reason
                                </label>

                                <textarea
                                    id="reason"
                                    name="reason"
                                    class="form-control"
                                    rows="4"
                                    placeholder="Enter reason for leave..."
                                    required
                                ></textarea>

                            </div>

                            <div class="d-flex flex-wrap gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Apply Leave
                                </button>

                                <a
                                    href="/dashboard/"
                                    class="btn btn-outline-secondary"
                                >
                                    Back to Dashboard
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
        const fromDate = document.getElementById("from_date");
        const toDate = document.getElementById("to_date");

        fromDate.addEventListener("change", function () {
            toDate.min = this.value || "{{ today }}";

            if (toDate.value && toDate.value < this.value) {
                toDate.value = this.value;
            }
        });
    </script>

</body>

</html>
