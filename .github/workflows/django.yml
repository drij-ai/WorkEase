name: Django CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Validate & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: workease_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: 'test-secret-key-for-ci-cd'
      DJANGO_SECRET_KEY: 'test-secret-key-for-ci-cd'
      DEBUG: 'True'
      DJANGO_DEBUG: 'True'
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/workease_test'
      DJANGO_SETTINGS_MODULE: 'workease.settings'
      DEFAULT_GATEWAY_API: 'razorpay'
      RAZORPAY_KEY_ID: 'rzp_test_mock_ci'
      RAZORPAY_KEY_SECRET: 'rzp_secret_mock_ci'
      PAYMENT_GATEWAY_CURRENCY: 'INR'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Check
        env:
          SECRET_KEY: 'test-secret-key-for-ci-cd'
          DEBUG: 'True'
          DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/workease_test'
          DJANGO_SETTINGS_MODULE: 'workease.settings'
        run: |
          python manage.py check

      - name: Validate OpenAPI Schema
        env:
          SECRET_KEY: 'test-secret-key-for-ci-cd'
          DEBUG: 'True'
          DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/workease_test'
          DJANGO_SETTINGS_MODULE: 'workease.settings'
        run: |
          python manage.py spectacular --validate

      - name: Run Database Migrations
        env:
          SECRET_KEY: 'test-secret-key-for-ci-cd'
          DEBUG: 'True'
          DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/workease_test'
          DJANGO_SETTINGS_MODULE: 'workease.settings'
        run: |
          python manage.py migrate --noinput

      - name: Run Django Test Suite
        env:
          SECRET_KEY: 'test-secret-key-for-ci-cd'
          DEBUG: 'True'
          DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/workease_test'
          DJANGO_SETTINGS_MODULE: 'workease.settings'
        run: |
          python manage.py test --noinput
