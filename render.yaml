services:
  - type: web
    name: workease
    runtime: python
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn workease.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DEFAULT_GATEWAY_API
        value: "razorpay"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PAYMENT_GATEWAY_CURRENCY
        value: "INR"
