services:
  - type: web
    name: workease
    runtime: python
    buildCommand: "./build.sh"
    preDeployCommand: "python manage.py migrate --noinput"
    startCommand: "gunicorn workease.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
